<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create</title>
<style>

body {
    background-color: #f0f2f5;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding-top: 50px;
    margin: 0;
}


form {
    background-color: #fff;
    padding: 30px 40px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 450px;
}


h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #333;
}


input, select, textarea {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 18px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
    transition: 0.3s;
    box-sizing: border-box;
}

input:focus, select:focus, textarea:focus {
    border-color: #007bff;
    box-shadow: 0 0 6px rgba(0,123,255,0.3);
    outline: none;
}


button {
    width: 100%;
    padding: 12px;
    background-color: #007bff;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background-color: #0056b3;
}


.errorlist {
    color: #dc3545;
    font-size: 12px;
    margin-top: -12px;
    margin-bottom: 12px;
    list-style: none;
    padding-left: 0;
}
</style>
</head>
<body>

<form method="post" enctype="multipart/form-data">
    <h2>Add new car</h2>
    {% csrf_token %}

    {{ form }}

    <button type="submit">Create</button>
</form>

</body>
</html>
