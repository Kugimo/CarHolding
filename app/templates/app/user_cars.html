<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Мои машины</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            padding-top: 80px;
            background-color: #f5f5f5;
        }

        .navbar-custom {
            width: 100%;
            height: 60px;
            background-color: #000;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            padding: 0 20px;
            color: white;
            font-size: 20px;
            font-weight: 600;
        }

        .card-img-top {
            height: 250px;
            object-fit: cover;
        }
    </style>
</head>

<body>

<div class="navbar-custom">
    CarHolding
</div>

<div class="container">

    <h1 class="text-center mb-4">My Cars</h1>

    {% if cars %}
        <div class="row g-4">

            {% for car in cars %}
                <div class="col-12 col-md-6 col-lg-4">
                    <a href="{% url 'car_detail' car.id %}" style="text-decoration: none; color: inherit;">
                        <div class="card shadow-sm">
                            <img src="{{ car.image.url }}" class="card-img-top" alt="...">
                            <div class="card-body">
                                <h5 class="card-title">{{ car.title }}</h5>
                            </div>
                        </div>
                    </a>
                </div>
            {% endfor %}

        </div>
    {% else %}
        <p class="text-center mt-5">You don't have any cars yet.</p>
    {% endif %}

</div>

</body>
</html>
